<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="Currently exploring and what I'm looking for"><title>Currently exploring and what I'm looking for</title><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="0.55" stop-color="#1b1740"/><stop offset="1" stop-color="#2d1b4e"/></linearGradient>

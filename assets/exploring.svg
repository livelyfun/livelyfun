"240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#dbe0ff" text-anchor="start">AI-assisted product features in real applications</text><circle cx="70" cy="261" r="4" fill="#818cf8"/><text x="86" y="266" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#dbe0ff" text-anchor="start">High-quality full-stack product engineering</text><line x1="64" y1="300" x2="836" y2="300" stroke="#fff" stroke-opacity="0.18"/><text x="64" y="334" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="start">What I'm looking for</text><text x="64" y="362" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#dbe0ff" text-anchor="start">Full-stack, backend and AI engineering roles where I can contribute to real-world systems</text><text x="64" y="382" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#dbe0ff" text-anchor="start">and ship useful products.</text></svg>
mily="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#dbe0ff">PySide6, Electron and</text><text x="476" y="165" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#dbe0ff">Python tools</text><rect x="658" y="88" width="186" height="104" rx="16" fill="#fff" fill-opacity="0.08" stroke="#fff" stroke-opacity="0.25"/><text x="676" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff">Automation &amp; AI</text><text x="676" y="146" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#dbe0ff">Workflows and Gemini-</text><text x="676" y="165" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#dbe0ff">powered products</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200" viewBox="0 0 420 200" role="img" aria-label="Smart File Organizer"><title>Smart File Organizer</title><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="0.55" stop-color="#1b1740"/><stop offset="1" stop-color="#2d1b4e"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.20"/><stop offset="1" stop-color="#fff" stop-opacity="0.05"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.65"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.08"/><stop offset="1" stop-color="#fff" stop-opacity="0.30"/></linearGradient>
<linearGradient id="txt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c7d2fe"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.4"/></filter>
</defs><clipPath id="clip"><rect width="420" height="200" rx="26"/></clipPath><rect width="420" height="200" rx="26" fill="url(#bg)"/><g clip-path="url(#clip)" filter="url(#blur)"><circle cx="70" cy="30" r="90" fill="#6366f1" opacity="0.7"></circle><circle cx="360" cy="190" r="100" fill="#22d3ee" opacity="0.55"></circle></g><rect x="14" y="14" width="392" height="172" rx="20" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.3" filter="url(#shadow)"/><text x="380" y="52" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" fill-opacity="0.45" text-anchor="end">01</text><text x="40" y="52" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff">Smart File Organizer</text><text x="40" y="82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#dbe0ff">Cross-platform CLI that automatically sorts</text><text x="40" y="103" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#dbe0ff">your Downloads folder into clean categories.</text><rect x="40" y="134" width="71" height="30" rx="15" fill="#fff" fill-opacity="0.10" stroke="#fff" stroke-opacity="0.28"/><text x="75.5" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e0e7ff" text-anchor="middle">Python</text><rect x="119" y="134" width="49" height="30" rx="15" fill="#fff" fill-opacity="0.10" stroke="#fff" stroke-opacity="0.28"/><text x="143.5" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e0e7ff" text-anchor="middle">CLI</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="100" viewBox="0 0 900 100" role="img" aria-label="Thanks for visiting">
  <title>Thanks for visiting</title>
  <defs>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="6" dy="6" stdDeviation="8" flood-color="#a3b1c6" flood-opacity="0.45"/>
      <feDropShadow dx="-5" dy="-5" stdDeviation="8" flood-color="#ffffff" flood-opacity="0.9"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8edf5"/>
      <stop offset="100%" stop-color="#d6dde8"/>
    </linearGradient>
  </defs>
  <rect width="900" height="100" rx="24" fill="url(#bg)"/>
  <rect x="40" y="22" width="820" height="56" rx="18" fill="#e0e5ec" filter="url(#soft)"/>
  <text x="450" y="56" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6a85" text-anchor="middle">Thanks for visiting · Open to collaboration</text>
</svg>
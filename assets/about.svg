<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-label="About me"><title>About me</title><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="0.55" stop-color="#1b1740"/><stop offset="1" stop-color="#2d1b4e"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.20"/><stop offset="1" stop-color="#fff" stop-opacity="0.05"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.65"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.08"/><stop offset="1" stop-color="#fff" stop-opacity="0.30"/></linearGradient>
<linearGradient id="txt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c7d2fe"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.4"/></filter>
</defs><clipPath id="clip"><rect width="900" height="270" rx="28"/></clipPath><rect width="900" height="270" rx="28" fill="url(#bg)"/><g clip-path="url(#clip)" filter="url(#blur)"><circle cx="120" cy="220" r="120" fill="#22d3ee" opacity="0.45"></circle><circle cx="800" cy="40" r="140" fill="#a855f7" opacity="0.55"></circle></g><rect x="30" y="30" width="840" height="210" rx="24" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.3" filter="url(#shadow)"/><text x="64" y="76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="start">About me</text><text x="64" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#e0e7ff" text-anchor="start">I enjoy building complete software systems, from backend architecture and</text><text x="64" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#e0e7ff" text-anchor="start">operational tooling to full-stack products and AI-assisted pipelines.</text><circle cx="70" cy="171" r="4" fill="#818cf8"/><text x="86" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#c7d2fe" text-anchor="start">Production systems that run in the real world: ERPs, monitoring, business platforms</text><circle cx="70" cy="193" r="4" fill="#22d3ee"/><text x="86" y="198" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#c7d2fe" text-anchor="start">Full-Stack · Backend Architecture · AI / RAG · Monitoring · Developer Tooling</text><circle cx="70" cy="215" r="4" fill="#f472b6"/><text x="86" y="220" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#c7d2fe" text-anchor="start">ship → break → understand → fix → improve</text></svg>
      <feDropShadow dx="10" dy="10" stdDeviation="12" flood-color="#a3b1c6" flood-opacity="0.55"/>
      <feDropShadow dx="-8" dy="-8" stdDeviation="12" flood-color="#ffffff" flood-opacity="0.9"/>
    </filter>
    <filter id="soft-sm" x="-40%" y="-40%" width="180%" height="180%">

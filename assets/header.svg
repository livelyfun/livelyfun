<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Mithlesh Kumar Das, Software Developer">
  <title>Mithlesh Kumar Das — Software Developer</title>
  <defs>

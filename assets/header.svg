  <text x="72" y="130" font-family="Segoe UI, system-ui, sans-serif" font-size="42" font-weight="700" fill="#2d3748">Mithlesh Kumar Das</text>
  <text x="72" y="168" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="400" fill="#5a6a85">Full-Stack · Backend · AI / RAG · Monitoring</text>
